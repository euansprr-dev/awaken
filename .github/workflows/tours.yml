# Runs autopilot screenshot tours on GitHub's macOS runners (Apple Silicon VMs with a paravirtual Metal GPU), several at
# once, so look tours no longer queue for hours on the owner's 16 GB Mac. Look tours only: a shared 3-core VM's frame
# times say nothing about a player's Mac, so perf tours (perf-*, the Lens bench, anything measuring ms) stay on the Mac
# under slot.sh tour. Builders dispatch it with tools/tour-ci.sh <script> [timeout] [KEY=VAL ...]: each dispatch is its
# own run on its own runner, and its shots, logs and summary are the run's artifact for 7 days.
# The public repo's forks can't trigger it: workflow_dispatch needs write access. Inputs reach the shell only through
# env, after the plan job has checked them.
name: Tours
run-name: Tour ${{ inputs.script || 'dev batch' }} ${{ inputs.knobs }} ${{ inputs.id }}

on:
  workflow_dispatch:
    inputs:
      script:
        description: Tour script, tools/autopilot/<name>.txt
        required: true
        type: string
      timeout:
        description: Seconds the client may run (tools/autopilot.sh's timeout; at most 3600)
        default: '1500'
        type: string
      knobs:
        description: tools/autopilot.sh knobs, KEY=VAL separated by spaces (PACK BACKEND LENS RD XMX ZGC CITY TECTONIC DH)
        default: ''
        type: string
      id:
        description: The caller's tag, shown in the run name (tools/tour-ci.sh finds its run by it)
        default: ''
        type: string
  # development only: pack/ci-tours runs .github/tours-dev.json. Removed before the workflow goes to build/awaken-v1.
  push:
    branches: ['pack/ci-tours']
    paths: ['.github/workflows/tours.yml', '.github/tours-dev.json', 'tools/autopilot.sh', 'tools/gradle.sh', 'tools/tour-report.py']

permissions:
  contents: read

jobs:
  # Checks the request and turns it into the tour matrix (one entry for a dispatch).
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          sparse-checkout: .github
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCRIPT: ${{ inputs.script }}
          TIMEOUT: ${{ inputs.timeout }}
          KNOBS: ${{ inputs.knobs }}
        run: |
          if [ "$EVENT" = push ]; then list=$(cat .github/tours-dev.json)
          else list=$(jq -cn --arg s "$SCRIPT" --arg t "$TIMEOUT" --arg k "$KNOBS" '[{script: $s, timeout: $t, knobs: $k}]'); fi
          matrix=$(jq -c 'map({script, timeout: (.timeout // "1500"), knobs: ((.knobs // "") | gsub("^ +| +$"; "") | gsub("  +"; " ")),
              os: (.os // "macos-15"), mvk: (.mvk // "")} + {name: (.name // (.script | sub("^tools/autopilot/"; "") | sub("\\.txt$"; "")))})' <<< "$list")
          # a script under tools/autopilot, a timeout in seconds, only the knobs autopilot.sh reads, plain values
          bad=$(jq -r '.[] | select(
              (.script | test("^tools/autopilot/[A-Za-z0-9._-]+\\.txt$") | not)
              or (.timeout | test("^[0-9]{2,4}$") | not) or ((.timeout | tonumber) > 3600)
              or (.os | test("^macos-[0-9a-z.-]+$") | not) or (.name | test("^[A-Za-z0-9._-]+$") | not)
              or ([.knobs | splits(" ") | select(length > 0)
                   | test("^(PACK|BACKEND|LENS|RD|XMX|ZGC|CITY|TECTONIC|DH)=[A-Za-z0-9,._-]+$") | not] | any))
            | "\(.script) timeout=\(.timeout) knobs=\(.knobs)"' <<< "$matrix")
          if [ -n "$bad" ]; then
            echo "::error::Not a tour this workflow runs: $bad (script tools/autopilot/<name>.txt, timeout <= 3600 s, knobs PACK BACKEND LENS RD XMX ZGC CITY TECTONIC DH)"
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          jq . <<< "$matrix"

  tour:
    needs: plan
    name: ${{ matrix.name }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # one tour per branch, script and knobs at a time; a second waits instead of cancelling (other branches never wait)
    concurrency:
      group: tours-${{ github.ref }}-${{ matrix.script }}-${{ matrix.knobs }}-${{ matrix.os }}
      cancel-in-progress: false
    env:
      SCRIPT: ${{ matrix.script }}
      TOUR_TIMEOUT: ${{ matrix.timeout }}
      KNOBS: ${{ matrix.knobs }}
      TOUR_NAME: ${{ matrix.name }}
      TOUR_RUNNER: ${{ matrix.os }}
      MVK_ARGBUF: ${{ matrix.mvk }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # The Gradle home (Minecraft, NeoForge, the decompiled game) is written only by runs on the default branch, which
      # every branch then reads; Minecraft's assets have their own entry below.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/build/awaken-v1' && github.event_name != 'push' }}
          gradle-home-cache-excludes: caches/neoformruntime/assets

      - name: Versions
        id: v
        run: |
          echo "mc=$(sed -n 's/^minecraft_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
          echo "AWAKEN_PACK_CACHE=$HOME/.awaken-pack-cache" >> "$GITHUB_ENV"

      # Mojang's assets, downloaded by the build on the runner and cached for the next ones; never in the repo or an
      # artifact (the repo is public).
      - name: Restore Minecraft assets
        id: assets
        uses: actions/cache/restore@v4
        with:
          path: ~/.gradle/caches/neoformruntime/assets
          key: mc-assets-${{ runner.os }}-${{ runner.arch }}-${{ steps.v.outputs.mc }}

      - name: Restore pack mods
        id: pack
        uses: actions/cache/restore@v4
        with:
          path: ~/.awaken-pack-cache
          key: awaken-pack-${{ hashFiles('pack/lock.json') }}
          restore-keys: awaken-pack-

      - name: Runner
        run: |
          mkdir -p tour-out
          {
            echo "label: $TOUR_RUNNER"; sw_vers; uname -m
            echo "cpus: $(sysctl -n hw.ncpu)  memory: $(( $(sysctl -n hw.memsize) / 1073741824 )) GB  cpu: $(sysctl -n machdep.cpu.brand_string)"
            echo "session: $(launchctl managername)  console user: $(stat -f %Su /dev/console)"
            system_profiler SPDisplaysDataType SPAudioDataType 2>/dev/null
            swift tools/ci-display.swift 2>&1 || true
          } | tee tour-out/runner.txt

      - name: Build
        run: |
          start=$(date +%s)
          ./gradlew --console=plain classes downloadAssets prepareAutopilotRun
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Tour
        run: |
          set -f
          for kv in $KNOBS; do export "$kv"; done
          set +f
          # development: MoltenVK's Metal argument buffers (the macOS 14 paravirtual GPU lacks newArgumentEncoderWithLayout)
          [ -z "$MVK_ARGBUF" ] || export MVK_CONFIG_USE_METAL_ARGUMENT_BUFFERS="$MVK_ARGBUF"
          # the runner has 7 GB: the client's heap leaves room for Gradle and the GPU's buffers
          export XMX="${XMX:-4G}"
          start=$(date +%s)
          tools/autopilot.sh "$SCRIPT" "$TOUR_TIMEOUT" 2>&1 | tee tour-out/autopilot.txt
          echo "TOUR_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Report
        id: report
        if: always()
        run: python3 -I tools/tour-report.py tour-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tour-${{ matrix.name }}
          path: tour-out/
          retention-days: 7
          compression-level: 1

      # the clip recorder's frames (tools/art/anim_lab.py film), when the script records any
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tour-${{ matrix.name }}-clips
          path: run-autopilot/clips/
          retention-days: 7
          compression-level: 0
          if-no-files-found: ignore

      - name: Save Minecraft assets
        if: always() && steps.assets.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/build/awaken-v1' || github.event_name == 'push')
        uses: actions/cache/save@v4
        with:
          path: ~/.gradle/caches/neoformruntime/assets
          key: mc-assets-${{ runner.os }}-${{ runner.arch }}-${{ steps.v.outputs.mc }}

      - name: Save pack mods
        if: always() && steps.pack.outputs.cache-hit != 'true' && hashFiles('pack/lock.json') != '' && (github.ref == 'refs/heads/build/awaken-v1' || github.event_name == 'push')
        uses: actions/cache/save@v4
        with:
          path: ~/.awaken-pack-cache
          key: awaken-pack-${{ hashFiles('pack/lock.json') }}

      - name: Verdict
        if: always()
        env:
          VERDICT: ${{ steps.report.outputs.verdict }}
        run: |
          echo "verdict: ${VERDICT:-no report}"
          [ "$VERDICT" = pass ]
