plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Modrinth's Maven, only for the optional mods Awaken talks to (compileOnly: never bundled, never required)
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.3, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // tools/play.sh --pack plays from its own folder (-PgameDir=run-pack) so new-terrain mods never touch run/'s worlds
            gameDirectory = project.file(project.findProperty('gameDir') ?: 'run')
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // the pack at 4K on a 16 GB Mac hitched with the default heap (a quarter of RAM, 4 GB at 78% and ~400 MB/s of
            // garbage): give it 8 GB by default, -Pxmx=... to change
            jvmArgument "-Xmx${project.findProperty('xmx') ?: '8G'}"
            jvmArgument '-Xms2G'
            // generational ZGC (docs/perf/CITY-FPS.md): in the city tour G1 paused 5.9 s in total, young pauses up to
            // 180 ms and a 417 ms full GC at join; ZGC paused 2 ms in total (max 0.7 ms) and was as fast or faster in
            // every scene. -Pg1 goes back to G1
            if (!project.hasProperty('g1')) jvmArgument '-XX:+UseZGC'
        }

        // Development only: plays a script (run-autopilot/script.txt) in its own game folder and takes screenshots.
        // tools/autopilot.sh writes the script and runs this.
        autopilot {
            client()
            gameDirectory = project.file('run-autopilot')
            systemProperty 'awaken.autopilot', project.file('run-autopilot/script.txt').absolutePath
            // open behind the owner's work: SDL neither activates the app nor focuses the window when it shows
            environment 'SDL_MAC_BACKGROUND_APP', '1'
            environment 'SDL_WINDOW_ACTIVATE_WHEN_SHOWN', '0'
            systemProperty 'apple.awt.UIElement', 'true'
            // frame-time experiments (tools/autopilot.sh with XMX=6G ZGC=1): the client's heap and garbage collector
            if (project.hasProperty('xmx')) jvmArgument "-Xmx${project.property('xmx')}"
            if (project.hasProperty('zgc')) jvmArgument '-XX:+UseZGC'
            // tools/autopilot.sh BACKEND=vulkan|opengl, as a launch argument: a fresh game folder (every CI tour, the first
            // tour after a pack install) reads its new options.txt as "default", which tries OpenGL first
            if (project.hasProperty('backend')) programArguments.addAll '--graphicsBackend', project.property('backend').toString().toUpperCase(Locale.ROOT)
            // tools/autopilot.sh SETTLE=<s>: each shot first waits, at most that long, for the terrain to load and build
            if (project.hasProperty('settle')) systemProperty 'awaken.autopilot.settle', project.property('settle').toString()
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            programArguments.addAll '--tests', 'awaken:*'
            // -Ptests=terrain_,anomaly_ registers only the tests whose names start with one of these prefixes (AwakenTests)
            if (project.hasProperty('tests')) systemProperty 'awaken.tests', project.property('tests').toString()
            // -PpowerAudit casts every damaging power at a line-up and logs who it hit (PowerHitTests)
            if (project.hasProperty('powerAudit')) systemProperty 'awaken.powerAudit', 'true'
            // -PmotionDiag records the server paths of a few creatures (Fauna3Tests, diagnostic)
            if (project.hasProperty('motionDiag')) systemProperty 'awaken.motionDiag', 'true'
            // never a Dock icon or a focus grab on the owner's Mac while tests run
            systemProperty 'java.awt.headless', 'true'
            systemProperty 'apple.awt.UIElement', 'true'
        }

        data {
            clientData()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // dev.awaken.compat: far terrain off inside gates, dreams and other instanced dimensions (pack/lock.json pins the same build)
    compileOnly "maven.modrinth:distanthorizons:3.3.4-26.3"
    // Lens steps aside while an Iris shaderpack is on (the Ultra look)
    compileOnly "maven.modrinth:iris:1.11.7+26.3-neoforge"
    // full-body cast clips (powers/client/fx/PalCasts). The version id, not "1.2.8": that number resolves to the 26.1 build
    compileOnly "maven.modrinth:player-animation-library:xJ30QmpE"
    // the Ascent's Feel Director pauses Camera Overhaul while it owns the camera (body.client.feel.CameraOverhaulPause;
    // version id of the build pack/lock.json pins, 2.1.2-neoforge+mc.26.3-plus)
    compileOnly "maven.modrinth:cameraoverhaul:8NAGipZQ"
    // the action camera drives Shoulder Surfing's over-the-shoulder view through its plugin API
    // (body.client.feel.ShoulderSurfingPlugin; version id of the build pack/lock.json pins, 26.3-5.2.0+neoforge)
    compileOnly "maven.modrinth:shoulder-surfing-reloaded:NLtlz49E"
    // the comfort profile's plugins (compat.jei, compat.jade): version ids, the exact builds pack/lock.json pins
    // (JEI 31.14.0.72, Jade 26.3.5+neoforge)
    compileOnly "maven.modrinth:jei:kLsKOFxv"
    compileOnly "maven.modrinth:jade:dVB8U7Td"
    // the sound profile's nature ambience (compat.client.AmbientSoundsBridge lowers it under AWAKEN's moments):
    // AmbientSounds 6.3.11 and CreativeCore 2.14.24, the builds pack/lock.json pins
    compileOnly "maven.modrinth:ambientsounds:dCMudV9Z"
    compileOnly "maven.modrinth:creativecore:Jyax6gDi"

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Shared JSON files (lang, sounds.json, tags) can't be owned by one module, so each module writes its part to
// src/main/merge/<module>/<resource path>. This task merges them: objects merge by key (duplicate keys fail the build),
// tag files ({"values": [...]}) merge their value lists.
var mergeResources = tasks.register("mergeResources") {
    def mergeSrc = file("src/main/merge")
    def mergeOut = layout.buildDirectory.dir("generated/merged").get().asFile
    inputs.dir(mergeSrc)
    outputs.dir(mergeOut)
    doLast {
        mergeOut.deleteDir()
        def merged = new TreeMap<String, Object>()
        def owners = [:]
        mergeSrc.listFiles().findAll { it.isDirectory() }.sort { it.name }.each { moduleDir ->
            moduleDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                if (!f.name.endsWith(".json")) return
                def rel = moduleDir.toPath().relativize(f.toPath()).toString()
                def parsed = new groovy.json.JsonSlurper().parse(f, "UTF-8")
                if (!merged.containsKey(rel)) { merged[rel] = parsed; owners[rel] = moduleDir.name; return }
                def into = merged[rel]
                if (into instanceof Map && into.containsKey("values") && parsed instanceof Map && parsed.containsKey("values")) {
                    into["values"] = (into["values"] + parsed["values"]).unique()
                } else if (into instanceof Map && parsed instanceof Map) {
                    parsed.each { k, v ->
                        if (into.containsKey(k)) throw new GradleException("Duplicate key '${k}' in ${rel} (modules ${owners[rel]} and ${moduleDir.name})")
                        into[k] = v
                    }
                } else {
                    throw new GradleException("Cannot merge ${rel}")
                }
            }
        }
        merged.each { rel, json ->
            def out = new File(mergeOut, rel)
            out.parentFile.mkdirs()
            out.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)), "UTF-8")
        }
    }
}
sourceSets.main.resources.srcDir mergeResources
neoForge.ideSyncTask mergeResources

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
