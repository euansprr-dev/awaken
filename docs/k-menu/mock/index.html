<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden}#stage{position:relative;overflow:hidden}#stage>img.bg{position:absolute;left:0;top:0}</style>
</head><body><div id="stage"></div>
<script src="engine.js"></script>
<script src="before.js"></script>
<script src="after.js"></script>
<script src="mapscene.js"></script>
<script src="scenes.js"></script>
<script>
(async () => {
  await Font.load('');
  const name = new URLSearchParams(location.search).get('scene') || 'calib';
  const stage = document.getElementById('stage');
  try { await SCENES[name](stage); } catch (e) { document.body.innerHTML = '<pre style="color:#f88;font-size:20px">' + e.stack + '</pre>'; }
  document.title = 'ready';
})();
</script></body></html>
