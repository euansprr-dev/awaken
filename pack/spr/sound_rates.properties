# Awaken: the sounds that stay dry under Sound Physics Remastered (the Awakened Pack's sound profile).
# Shipped by tools/pack.py install (pack/mods.json "configs") only when this file is missing; SPR then adds every
# other sound event at -1 (processed, no limit) and keeps these. 0 = no sound physics for that event (SPR's own rule).
# Why dry: the System's voice and the interface live in your head, not in the room; music (cues, gate and Descent
# tracks, the layered stems) is not a sound in the world; the Ritual's scripted voices are the scene speaking to you.
# Everything else of Awaken's (creatures, powers, gates, ambience beds) gets the room it is played in.
# Checked by the GameTest compat_spr_dry_list (docs/modules/audio.md "Room acoustics").

# the System's voice and the interface
awaken\:level_up=0
awaken\:rank_up=0
awaken\:signal.chime=0
